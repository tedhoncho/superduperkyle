<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feature Contest Leaderboard — Super Duper Kyle</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-bar">
      <a href="/" class="brand">
        <img src="/images/kyle-heart-logo.png" alt="Super Duper Kyle" class="brand-logo" />
      </a>
      <nav class="site-nav">
        <a href="/" class="nav-link">&larr; Store</a>
        <a href="https://www.superduperkyle.com" class="nav-link">Main Site</a>
      </nav>
    </div>
    <!-- Only shows while Kyle is actually streaming (see /api/twitch-status,
         server/twitch.js) — leaderboard.js polls this periodically since a
         fan might be sitting on this page when he goes live. Sits above the
         countdown below: happening right now beats a countdown to later. -->
    <div id="live-banner" class="live-banner hidden">
      <a id="live-banner-link" class="live-banner-link" target="_blank" rel="noopener">
        <span class="live-banner-row">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="live-banner-text" class="live-banner-text">Kyle is live on Twitch right now</span>
          <span id="live-banner-viewers" class="live-banner-viewers hidden"></span>
        </span>
        <span class="live-banner-cta">Watch on Twitch and hit Follow &mdash; it helps us land on their homepage &rarr;</span>
      </a>
    </div>
    <!-- Quiet, always-on version of the same ask for the far more common
         case: someone browsing the leaderboard while Kyle isn't streaming.
         Mutually exclusive with #live-banner above -- renderLiveBanner in
         leaderboard.js shows exactly one of the two, never both. Appears as
         soon as TWITCH_CHANNEL_LOGIN is set, even before the full API
         credentials needed for live detection are in place. -->
    <div id="twitch-follow-banner" class="twitch-follow-banner hidden">
      <a id="twitch-follow-link" class="twitch-follow-button" target="_blank" rel="noopener">Follow Kyle on Twitch &rarr;</a>
    </div>
    <!-- Same banner as the store page header (see .countdown-banner in
         styles.css) — this is expected to be the highest-traffic page, so
         Ted wants fans landing here to also see a new release counting down,
         not just people browsing the store. Driven by leaderboard.js, which
         reads the same site-wide /api/site-settings the storefront does. -->
    <div id="countdown-banner" class="countdown-banner hidden">
      <span id="countdown-label" class="countdown-label"></span>
      <span id="countdown-clock" class="countdown-clock"></span>
    </div>
  </header>

  <main id="leaderboard-main" class="leaderboard-page">
    <p class="loading">Loading…</p>
  </main>

  <div id="spotify-footer" class="spotify-footer hidden"></div>

  <script src="/leaderboard.js"></script>
</body>
</html>
